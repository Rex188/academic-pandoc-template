title: "A Structural Spectrum of Contingency"
subtitle: "Decoupling Spectral Color from Nonlinear Determinism in Expressive Instrumental Gestures"
author:
  - name: Xingyi Li
    affiliation: Nanjing Foreign Language School, Nanjing, China
date: September 2026
abstract: |
  Digital musical instruments often discard bodily motor fluctuations as sensor noise. Following physiological motor control literature, we initially hypothesized ($H_{\text{init}}$) that expressive percussive gestures would follow scale-invariant $1/f^\beta$ pink noise ($\beta \approx 1$). Empirical recordings from Robin—a custom gesture-augmented instrument—disproved this assumption. During high-speed orchestral rolls, the Fourier slope collapsed to $\beta \approx 0.16$, superficially mimicking uncorrelated white noise; chaotic baselines further demonstrated that $\beta$ is mathematically ill-defined on nonlinear attractors. Falsifying this single-axis model motivated our decoupled Two-Axis Framework: Axis 1 measures macroscopic spectral tilt (Welch PSD with sub-band stability $\Delta_\beta < 0.20$), while Axis 2 tests higher-order phase coupling using Iterative Amplitude Adjusted Fourier Transform (IAAFT) surrogates and Sample Entropy. Synthetic controls confirm false-positive resistance on PRNG noise ($0/10$ rejections, $p = 0.6139$) and full sensitivity on chaotic dynamics ($10/10$ detections, $p = 0.0198$). Across nine empirical channels spanning discrete strikes, locomotion flow, and rapid rolls, bodily motion consistently rejects the linear stochastic null ($p < 0.02$). Axis 2 unmasks tight deterministic neuromuscular coordination where linear spectra see only white noise. Native-rate decimation audits confirm that significance persists without zero-order hold artifacts, demonstrating that musical motor fluctuations inhabit low-dimensional deterministic manifolds rather than stochastic drift.
