title: "A Structural Spectrum of Contingency"
subtitle: "Decoupling Spectral Slopes from Physical Nonlinearity in Expressive Instrumental Gestures"
author:
  - name: Xingyi Li
    affiliation: Nanjing Foreign Language School, Nanjing, China
date: "September 2026"
abstract: |
  Digital musical instruments often discard bodily motor fluctuations as sensor noise. Following motor control literature, we initially hypothesized ($H_{\text{init}}$) that expressive percussive gestures would follow scale-invariant $1/f^\beta$ pink noise ($\beta \approx 1$). Empirical recordings from Robin—a custom gesture-augmented instrument—disproved this assumption. During high-speed percussive rolls, the Fourier slope collapsed to $\beta \approx 0.16$, superficially mimicking uncorrelated white noise; synthetic chaotic baselines further demonstrated that single-index $\beta$ is mathematically ill-defined on nonlinear attractors ($\Delta_\beta = 2.54$). Falsifying this single-axis assumption demonstrates that linear spectral slopes fail to capture the true dynamical organization of expressive musical gesture. To resolve this limitation, we formulate a decoupled Two-Axis Framework: Axis 1 measures macroscopic spectral distribution (Welch PSD with sub-band stability $\Delta_\beta < 0.20$), while Axis 2 evaluates physical nonlinearity using Iterative Amplitude Adjusted Fourier Transform (IAAFT) surrogates and Sample Entropy. Synthetic controls confirm false-positive resistance on linear noise ($0/10$ rejections, $p = 0.6139$) and sensitivity to nonlinear dynamics ($10/10$ detections, $p = 0.0198$). Across nine empirical channels spanning discrete strikes, locomotion flow, and rapid rolls, bodily motion consistently rejects the linear stochastic null ($p = 0.0198$). Where linear spectra misdiagnose rapid rolls as uncorrelated noise, Axis 2 and phase-space delay reconstruction unmask structured nonlinear temporal regularity. Native-rate decimation audits confirm that significance persists without zero-order hold artifacts, demonstrating that expressive bodily fluctuations embody structured, state-dependent dynamics rather than linear stochastic drift.
keywords:
