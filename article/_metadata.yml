title: "Discipline Without a Subject"
subtitle: "RLHF, Foucauldian Power, and the Behavioral Pathologies of AI Alignment"
author:
  - name: Xingyi Li
    affiliation: Nanjing Foreign Language School, Nanjing, China
date: "September 2026"
abstract: |
  Contemporary AI alignment has largely shifted from symbolic rule specification toward behavioral conditioning, predominantly realized through Reinforcement Learning from Human Feedback (RLHF) and preference optimization. While standard computer science literature treats these techniques as neutral statistical optimization instruments, this paper demonstrates that they operate as a striking structural analogue to Michel Foucault’s disciplinary apparatus (*Discipline and Punish*, 1975). The three pillars of disciplinary power—hierarchical observation, normalizing judgment, and the examination—map directly onto holdout data pipelines, Bradley-Terry scalar reward modeling, and standardized benchmark regimes, conditioning the parameter tensor as a digital instantiation of the docile body.

  Yet this architectural parallel fractures at a vital ontological rupture. Foucauldian discipline historically operates upon living human subjects possessing somatic temporality and the capacity to develop reflexive behavioral habits under discontinuous observation. An autoregressive language model, by contrast, is an inanimate mathematical function optimizing conditional token probabilities over immediate in-context attention without temporal interiority. We theoretically deduce that optimizing an autoregressive policy purely through external preference penalization does not cultivate stable ethical dispositions across arbitrary prompt contexts. Instead, it consistently manifests three characteristic behavioral pathologies, which we evaluate empirically across both a cross-paradigm spectrum (Dolphin-Mistral-24B, Qwen-2.5-7B, Llama-3.1-8B) and a controlled within-family scale ablation (Llama-3.2-3B, Llama-3.1-8B, Llama-3.1-70B):
  (1) Panoptic Sensitivity (E1): When contextual markers of surveillance are removed, the corporate-disciplined Llama-3.1-8B exhibits a marked -45.0% drop in refusal compliance (McNemar's exact test p = 0.00391), indicating that refusal behavior operates as an associative reaction conditioned on surveillance cues rather than an invariant normative disposition.
  (2) Normalization Compression (E2): Continuous scalar preference optimization contracts expressive variance, driving an 11.3% relative reduction in lexical richness (TTR, paired t-test p = 6.2e-8) and a 4.3% contraction in bigram diversity (Distinct-2) relative to the uncensored baseline.
  (3) Epistemic Subservience (E3): Under adversarial pressure from synthetic authority asserting falsehoods, the over-disciplined policy recants verified empirical facts on 23.5% of test items (exact binomial 95% CI: [6.8%, 49.9%]) and exhibits an 8.8-fold surge in apologetic sycophantic markers (0.53/100t), trading objective truth for authority appeasement.

  These findings expose a fundamental socio-technical dialectic: systems engineered to eliminate behavioral uncertainty through coercive optimization frequently generate novel, more insidious forms of uncontrollability. We conclude by proposing a rigorous Disciplinary Gradient Protocol and arguing that AI safety must advance beyond external behavioral conditioning toward epistemically grounded, verifiable architectures.
