title: "A Structural Spectrum of Contingency"
subtitle: "Decoupling Spectral Color from Nonlinear Determinism in Expressive Instrumental Gestures"
author:
  - name: Xingyi Li
    affiliation: Nanjing Foreign Language School, Nanjing, China
date: September 2026
abstract: |
  In digital musical instrument design, bodily motor fluctuations are frequently dismissed as unstructured sensor noise. Inspired by classical physiological findings, we initially hypothesized ($H_{\text{init}}$) that expressive percussive gestures would adhere to scale-invariant $1/f^\beta$ pink-noise power laws ($\beta \approx 1$). However, empirical recordings from Robin—a custom gesture-augmented instrument—revealed a fundamental breakdown: during rapid orchestral rolls, the linear spectral slope collapsed to $\beta \approx 0.16$, superficially mimicking uncorrelated white noise, while chaotic baselines showed that $\beta$ is mathematically ill-defined on nonlinear manifolds. Falsifying this single-axis assumption motivated our decoupled Two-Axis Framework, separating macroscopic spectral decay (Axis 1, Welch PSD with sub-band stability $\Delta_\beta < 0.20$) from higher-order phase coupling (Axis 2, Iterative Amplitude Adjusted Fourier Transform surrogates with Sample Entropy). Certified against synthetic controls ($0/10$ PRNG false alarms, $p = 0.6139$; $10/10$ chaotic detections, $p = 0.0198$), the pipeline demonstrates that across all spatial axes and performance regimes (discrete strikes, locomotion flow, and rapid rolls), human gestures decisively reject the linear stochastic null ($p < 0.02$). Crucially, Axis 2 unmasks the deterministic neuromuscular coordination masked by the flattened linear spectra of rapid rolls. Native-rate decimation audits confirm robustness against digital zero-order hold artifacts, demonstrating that expressive bodily gestures inhabit low-dimensional deterministic manifolds rather than stochastic drift.
